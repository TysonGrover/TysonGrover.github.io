<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Tyson's Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #d9d9d9;
            color: #333;
        }

        /* Navigation */
        nav {
            background-color: #f5f5f5;
            padding: 20px 35px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 40px;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-size: 18px;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #666;
        }

        /* Main Content */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 77px);
            padding: 40px 20px;
        }

        .content {
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #2d2d2d;
        }

        .tagline {
            font-size: 1.1rem;
            color: #666;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* Profile Image */
        .profile-image {
            width: 300px;
            height: 400px;
            border-radius: 10px;
            object-fit: cover;
            border: 8px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }

        /* Contact Info */
        .contact-info {
            width: 100%;
            background-color: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-top: 30px;
        }

        .contact-item {
            margin-bottom: 30px;
        }

        .contact-item:last-child {
            margin-bottom: 0;
        }

        .contact-label {
            font-size: 0.9rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .contact-value {
            font-size: 1.3rem;
            color: #2d2d2d;
            font-weight: 500;
        }

        .contact-value a {
            color: #2d2d2d;
            text-decoration: none;
            transition: color 0.3s;
        }

        .contact-value a:hover {
            color: #666;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="content">
            <h1>Get In Touch</h1>
            <p class="tagline">Let's Connect</p>

            <img src="LTPicture.jpg" alt="Tyson" class="profile-image">

            <div class="contact-info">
                <div class="contact-item">
                    <div class="contact-label">Name</div>
                    <div class="contact-value">Tyson Grover, E.I.T</div>
                </div>

                <div class="contact-item">
                    <div class="contact-label">Phone</div>
                    <div class="contact-value">
                        <a href="tel:+14355128445">(435) 512-8445</a>
                    </div>
                </div>

                <div class="contact-item">
                    <div class="contact-label">Email</div>
                    <div class="contact-value">
                        <a href="mailto:groverty6@gmail.com">groverty6@gmail.com</a>
                    </div>
                </div>

                <div class="contact-item">
                    <div class="contact-label">LinkedIn</div>
                    <div class="contact-value">
                        <a href="https://www.linkedin.com/in/tyson-grover-074947228/" target="_blank">linkedin.com/in/tyson-grover</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
